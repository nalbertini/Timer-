name: Pubblica

on:
  push:
    # `main` è la destinazione finale. Il branch di lavoro è qui perché al
    # momento è ancora lui il default del repository e la pull request non è
    # stata unita: appena lo sarà, questa seconda riga si può togliere.
    branches:
      - main
      - claude/interval-timer-gym-app-ezesr2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione per volta, senza interrompere quella in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Il controllo dei tipi è dentro `npm run build` (tsc -b && vite build):
      # se non compila, il push è rosso.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Pubblica
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      # Niente `configure-pages`: provato due volte, da repository privato e da
      # pubblico, risponde sempre «Resource not accessible by integration». Il
      # token del workflow non può creare il sito Pages, e non è un permesso
      # concedibile da `permissions:`. Accenderlo resta un passaggio a mano in
      # Settings › Pages › Source: GitHub Actions, una volta sola.
      - id: pubblicazione
        uses: actions/deploy-pages@v4
