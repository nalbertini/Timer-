name: Compila

# GitHub Pages non è utilizzabile qui: su un repository privato richiede un
# piano a pagamento. Questo workflow si limita quindi a due cose utili comunque:
# controllare che il progetto compili a ogni push, e lasciare il pacchetto
# pronto da scaricare e caricare su un hosting qualsiasi.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Il controllo dei tipi è dentro `npm run build` (tsc -b && vite build):
      # se non compila, il push è rosso.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ods-timer-sito
          path: dist
          retention-days: 30
          if-no-files-found: error
